line-length = 100
target-version = "py312"
fix = true
show-fixes = true

exclude = [
    ".git",
    ".venv",
    "notebooks",
]

[lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501", "N999"]

[lint.per-file-ignores]
"src/app/pages/*" = ["F401", "F841", "I001"]
"**/run_etl.py" = ["F401", "F841", "I001"]
"*.ipynb" = ["E731", "UP031", "T201"]
"src/scripts/*" = ["E402"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"