services:
  postgres_db:
    image: postgres:15
    container_name: energy_postgres
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl_worker:
    build: 
      context: .
      dockerfile: Dockerfile.etl
    container_name: energy_etl
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
    depends_on:
      postgres_db:
        condition: service_healthy

  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: energy_streamlit
    restart: always
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres_db
      - POSTGRES_PORT=5432
    depends_on:
      postgres_db:
        condition: service_healthy

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: energy-dash-mlflow:v3.17.0
    container_name: energy_mlflow
    restart: always
    env_file:
      - .env
    depends_on:
      postgres_db:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    command: >
      mlflow server
      --backend-store-uri postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000

volumes:
  postgres_data:
  mlflow_artifacts: